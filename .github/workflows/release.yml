name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows Desktop & CLI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release -p luckymatch-desktop -p luckymatch-cli

      - name: Package Windows zip & installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\luckymatch-windows-x64 | Out-Null
          Copy-Item target\release\luckymatch-desktop.exe dist\luckymatch-windows-x64\
          Copy-Item target\release\luckymatch-cli.exe dist\luckymatch-windows-x64\
          Copy-Item config.example.json dist\luckymatch-windows-x64\
          Copy-Item README.md dist\luckymatch-windows-x64\
          Compress-Archive -Path dist\luckymatch-windows-x64\* -DestinationPath dist\luckymatch-windows-x64.zip -Force

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $appVer = if ($env:GITHUB_REF_NAME -match '^v(.+)$') { $matches[1] } else { "0.1.1" }
          & $iscc "/DAppVersion=$appVer" packaging\windows\luckymatch.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luckymatch-windows-x64
          path: |
            dist/luckymatch-windows-x64.zip
            dist/luckymatch-setup-x64.exe

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android NDK, SDK 35 & cargo-ndk
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          NDK_DIR="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            NDK_DIR="$(ls -d "$SDK_ROOT"/ndk/* 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            echo "No preinstalled Android NDK found under $SDK_ROOT/ndk" >&2
            exit 1
          fi
          echo "Using NDK: $NDK_DIR"
          if [ ! -d "$SDK_ROOT/platforms/android-35" ] || [ ! -d "$SDK_ROOT/build-tools/35.0.0" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build Rust FFI .so libraries & UniFFI Kotlin bindings
        run: |
          mkdir -p android/app/src/main/jniLibs android/app/src/main/java
          RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384" cargo ndk -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs build -p luckymatch-ffi --release
          cargo run -p luckymatch-ffi --features bindgen-cli --bin uniffi-bindgen -- generate --library android/app/src/main/jniLibs/arm64-v8a/libluckymatch_ffi.so --language kotlin --out-dir android/app/src/main/java

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Stage APK artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/luckymatch-android.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: luckymatch-android
          path: dist/luckymatch-android.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/luckymatch-windows-x64/luckymatch-setup-x64.exe
            artifacts/luckymatch-windows-x64/luckymatch-windows-x64.zip
            artifacts/luckymatch-android/luckymatch-android.apk
