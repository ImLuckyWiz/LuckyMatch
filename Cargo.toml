[workspace]
resolver = "2"
members = [
    "crates/luckymatch-core",
    "crates/luckymatch-ffi",
    "crates/luckymatch-cli",
    "crates/luckymatch-desktop",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/ImLuckyWiz/LuckyMatch"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "fs", "macros"] }
thiserror = "2"
tracing = "0.1"
